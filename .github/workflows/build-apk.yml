
name: Construir ST Lyrics APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ST-Lyrics-Android-prototipo.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extraer proyecto
        run: |
          unzip -q ST-Lyrics-Android-prototipo.zip -d extraido
          cd extraido/ST-Lyrics-Android
          npm install
          npx cap add android
          npx cap sync android

      - name: Construir APK
        run: |
          cd extraido/ST-Lyrics-Android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ST-Lyrics-APK
          path: extraido/ST-Lyrics-Android/android/app/build/outputs/apk/debug/app-debug.apk
          
